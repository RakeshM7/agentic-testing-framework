# Agent platforms: how each one names tools, where its agent files and MCP config go, and which identifiers a neutral
# agent body may not contain. `node scripts/build-agents.mjs` renders every agents/<name>.md once per platform below,
# from the agent's capabilities (config/permissions.yaml), its model (config/models.yaml) and the MCP servers
# (config/mcp.yaml). Platform syntax lives ONLY here and in scripts/lib/agents/renderers/<renderer>.mjs.
# Adding a platform = one block here + one renderer. Never hand-edit the generated files; `npm run check` fails on drift.
#
# tools: neutral capability -> this platform's tool names, in the order they appear in an agent's `tools:`.
#   Capabilities (scripts/lib/agents/capabilities.mjs): read, search, write, shell, web_fetch, web_search, spawn,
#   browser, ask. A capability mapped to [] has no tool on this platform. Duplicate names are emitted once.
#   spawn:   template, {agents} = the agent's `spawns` list joined with ", "
#   browser: template, {server} = config/mcp.yaml browser_server, {tool} = short name from scripts/lib/browser-tools.mjs
# forbidden_in_body: identifiers that are tool syntax on this platform. A neutral body must contain none of them, for
#   ANY platform (scripts/lib/agents/lint.mjs checks every source body against the union).

platforms:
  claude:
    renderer: claude
    output: ".claude/agents/{name}.md"
    mcp_config: { path: ".mcp.json", key: mcpServers }
    tools:
      read: [Read]
      search: [Glob, Grep]
      write: [Write, Edit]
      shell: [Bash]
      web_fetch: [WebFetch]
      web_search: [WebSearch]
      spawn: "Agent({agents})"
      browser: "mcp__{server}__browser_{tool}"
      ask: [AskUserQuestion]
    forbidden_in_body: [AskUserQuestion, "mcp__", "Agent(", WebSearch, WebFetch, TodoWrite]

  # One file serves all three Copilot surfaces: VS Code Copilot Chat, Copilot CLI and the cloud coding agent.
  copilot:
    renderer: copilot
    output: ".github/agents/{name}.agent.md"
    mcp_config: { path: ".vscode/mcp.json", key: servers }
    body_limit: 30000                     # GitHub's limit on a custom agent's prompt, in characters
    tools:                                # GitHub's documented aliases; every surface ignores names it does not know
      read: [read]
      search: [search]
      write: [edit]
      shell: [execute]
      web_fetch: [web]                    # `web` covers fetch and search: Copilot has no fetch-only grant; the guard
      web_search: [web]                   # still blocks web research for agents whose permissions say `none`
      spawn: "agent"                      # the renderer adds the `agents:` allow-list
      browser: "{server}/browser_{tool}"
      ask: ["vscode/askQuestions", ask_user]   # VS Code / Copilot CLI; the cloud agent has no ask tool
    # VS Code runs a custom agent's own `hooks` (Preview) only while that agent is active, so the build bakes the
    # agent's name into its hook command: that is how the guard learns who is calling (Copilot payloads carry no
    # agent identity). Rendered into every Copilot agent; {name} = the agent, {fw} = the framework's path from the
    # workspace (D-085; nothing in this repo).
    identity_hook:
      event: PreToolUse
      command: "node {fw}/scripts/hooks/pretooluse.mjs --host vscode --agent {name}"
    forbidden_in_body: ["vscode/askQuestions", ask_user, "playwright/browser_", runSubagent, run_in_terminal]

  # One file serves all three Antigravity surfaces: the App, the agy CLI and the IDE. Antigravity is not verified live
  # yet: the names below are antigravity.google/docs' (read 2026-10-27), and the ones marked UNVERIFIED wait on the
  # spike (docs/antigravity-spike/). The workspace's .agents/hooks.json registers the guard (lib/hook-registrations.mjs).
  antigravity:
    renderer: antigravity
    output: ".agents/agents/{name}.md"
    mcp_config: { path: ".agents/mcp_config.json", key: mcpServers }
    tools:                                # Antigravity's documented built-in tool names
      read: [view_file, list_dir]
      search: [grep_search, find_by_name]
      write: [write_to_file, replace_file_content, multi_replace_file_content]
      shell: [run_command]
      web_fetch: [read_url_content]
      web_search: [search_web]
      spawn: "invoke_subagent"            # no subagent allow-list key: the guard enforces each agent's `spawns`
      browser: "mcp_{server}_browser_{tool}"   # UNVERIFIED: how Antigravity names an MCP server's tools
      ask: [ask_question]
    # No identity_hook yet: whether Antigravity runs a hook from an agent's own frontmatter is UNVERIFIED (spike check
    # 3). Until it is, the guard can't tell which agent is calling, so a full-run call gets the run's combined ceiling,
    # as on the Copilot CLI hosts (D-035). Add the hook here once the spike shows its shape.
    forbidden_in_body: [view_file, list_dir, grep_search, find_by_name, write_to_file, replace_file_content, run_command, read_url_content, search_web, invoke_subagent, ask_question, "mcp_playwright_browser_"]
