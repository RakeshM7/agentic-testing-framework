<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>
{{css}}
</style>
</head>
<body>
<a class="skip" href="#deck">Skip to the slides</a>
<main id="deck" aria-label="{{title}}">

</nav>

{{js}}
</script>
</body>
</html>
