name: Visual baselines (Linux)

# The committed visual baselines are *-darwin.png only, so visual specs cannot pass on a Linux CI
# runner. This manual workflow regenerates them on Linux and uploads them as an artifact; download
# the artifact, review the images, and commit the *-linux.png files yourself. It never pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: playwright-tests
    env:
      CI: "true"
      EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
      EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate Linux baselines (EventHub + unauthenticated Freshsales login page)
        run: npx playwright test tests/visual --project=chromium --project=freshsales-unauth --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: playwright-tests/tests/visual/**/*-snapshots/*-linux.png
          if-no-files-found: error
