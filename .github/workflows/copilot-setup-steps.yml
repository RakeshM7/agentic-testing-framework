# Environment for the GitHub Copilot cloud coding agent: GitHub runs the `copilot-setup-steps` job before the agent
# starts. The cloud agent does framework maintenance and offline work only -- no live browser (docs/platforms.md) --
# so it gets the scripts, the generated test projects' dependencies for typechecks and `--list`, and k6 for
# `k6 inspect`, but no browsers.
#
# Safety: its tool calls go through .github/hooks/framework-guard.json -> scripts/hooks/pretooluse.mjs. That host
# cannot identify the calling agent, so in a full-run the guard gives every call the run's combined ceiling (what at
# least one of the run's agents may do, D-035), and design-decision confirmations (ask) are refused: the agent
# reports them in its PR instead.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Framework scripts
        run: npm ci
      - name: Generated Playwright projects (typecheck and --list only)
        run: |
          for d in playwright-tests/*/; do
            [ -f "$d/package-lock.json" ] || continue
            (cd "$d" && npm ci)
          done
      - uses: grafana/setup-k6-action@v1
