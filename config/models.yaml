# Single source of truth for which model each agent uses, per platform.
#
# Do NOT hand-edit the `model:` frontmatter line in an agent file -- the next run of
# scripts/sync-agent-models.mjs overwrites it with whatever is here. Edit this file, then run:
#
#   node scripts/sync-agent-models.mjs          (or `--check` in CI)
#
# Only the `claude` platform is wired up today. The structure is platform-keyed on purpose: adding another
# platform later means adding a key under each agent here plus one entry in PLATFORMS in the sync script --
# the pipeline, artifact contract and scripts are platform-neutral and stay unchanged.
#
# `claude` values must be ones Claude Code's `model:` frontmatter accepts (alias: sonnet | opus | haiku,
# or a pinned model id).

agents:
  orchestrator-agent:
    claude: sonnet

  explore-agent:
    claude: sonnet

  requirements-clarification-agent:
    claude: sonnet

  testcase-generator-agent:
    claude: sonnet

  playwright-automation-agent:
    claude: sonnet

  api-testing-agent:
    claude: sonnet

  feedback-implementor-agent:
    claude: sonnet
