# Which model each agent uses, per platform (the platform keys of config/platforms.yaml). Applied by
# `node scripts/build-agents.mjs` (part of `npm run check`), which writes the `model:` line of every generated agent
# file -- never hand-edit that line.
#
# `default` applies to every agent without an entry under `agents`; an entry may override one platform only.
#   claude:  sonnet | opus | haiku, or a pinned model id.
#   copilot: the model's name as Copilot lists it. For now this is gpt-6-luna, not the Claude model, so the two
#            platforms run different models (docs/decisions.md D-034). Check the name against the Copilot model
#            picker when changing it (an unknown name falls back to the surface's default model).
#
# Per-role tiering (e.g. stronger models for planners/reviewers/triagers) is not decided yet: everything uses the
# default until it is.

default:
  claude: claude-opus-5-5
  copilot: gpt-6-luna

agents: {}
