# Which model each agent uses, per platform. Applied by `node scripts/build-agents.mjs` (part of `npm run check`),
# which writes the `model:` line of every .claude/agents/<name>.md -- never hand-edit that line.
#
# `default` applies to every agent without an entry under `agents`. Claude values: sonnet | opus | haiku, or a
# pinned model id. Only the `claude` platform is wired up; another platform would add its own key here and in
# build-agents.mjs.
#
# Per-role tiering (e.g. stronger models for planners/reviewers/triagers) is not decided yet: everything uses the
# default until it is.

default:
  claude: claude-opus-5-5

agents: {}
