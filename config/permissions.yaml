# Per-agent permissions: the single, reviewable statement of what each agent may do, on every platform.
#
# Two things are derived from it, so a prompt can never grant more than this file:
#   1. each generated agent file's tool list and subagent allow-list, per platform (scripts/build-agents.mjs with
#      config/platforms.yaml), and
#   2. the framework guard (scripts/lib/guard.mjs), which applies the calling agent's row to every guarded tool call:
#      spawns, shell, HTTP/load, browser actions and the filesystem write allow-list. `run.mjs init` freezes this
#      file into the run's state/permissions.resolved.json, so a run's permissions cannot change under it.
# Fields are neutral capabilities, never a platform's tool names.
#
# ---- Field meanings --------------------------------------------------------------------------------------
# layer            0 = main session (orchestrator) | 1 = domain orchestrator or product-level worker | 2 = worker
# spawns           exact agent names this agent may start (its subagent allow-list); [] = cannot spawn.
#                  Workers never spawn: all communication between agents goes through the parent orchestrator,
#                  using files as the hand-off (no agent talks to a sibling).
# live_target      what the agent may do against the PRODUCT UNDER TEST (the live app):
#     browser:     none | read (navigate, observe, screenshot) | mutate (click/submit/create/edit/delete)
#     http:        none | read (GET/HEAD/OPTIONS) | mutate (POST/PUT/PATCH/DELETE)
#     load:        none | run   (execute k6 against the target)
#     Every `mutate`/`run` is ALWAYS scoped to entities the CURRENT run created (state/ledger.jsonl, entries are
#     tagged with the run id); deletes of anything else are blocked by the guard regardless of this file.
# web_research     none | allowed -- may fetch pages from the public internet that are NOT the product under test
# shell            none | restricted (only the commands listed in `shell_allow`) | project (any command that
#                  passes the guard, e.g. npm/npx/node/k6 inspect)
# ask_user         none | allowed -- may ask the human questions (main session only; default none)
# filesystem       read / write glob lists (variables below).
#
# ---- How this combines with authorizations.mode (run-config) ---------------------------------------------
# DECIDED: the run's authorizations.mode CAPS every agent. In `readonly` runs every `mutate` / `run` below is
# automatically reduced to `read` / `none` for ALL agents (no per-agent override). In `full-run` runs the values in
# this file apply as written, except the browser: any agent with browser access (read or mutate) gets the FULL
# browser in full-run (`none` stays none). Computed by the guard (effectiveLiveTarget).
#
# ---- Variables (layout v2: everything is product-level, there is no artifacts/<run-id>/ directory) --------
variables:
  product_dir: "artifacts/${product}"
  knowledge: "artifacts/${product}/knowledge"                 # reusable per-product knowledge base
  modules: "artifacts/${product}/modules/${module}"           # per-module working files, latest state
  state: "artifacts/${product}/state"                         # run.json, ledger.jsonl, lock, orchestration/, history/
  results: "artifacts/${product}/results/${run_id}"           # per-run archive: review findings, results, triage, report
  pw_project: "playwright-tests/${product}"                   # ONE Playwright repo: tests/ui + tests/api
  k6_project: "k6-tests/${product}"
#
# ---- Decision log (the reasons and the full log: docs/decisions.md) -------------------------------------
# Mode caps permissions | knowledge-generator: live product only if needed | module-explorer: mutate
# scaffolders: web research allowed | api-discoverer: http read | global feedback implementor: as drafted
# Limits: review rounds = 3, heal rounds = 3 | one active run per product (state/lock.json)
#
# ---- Shared-repo ownership inside ${pw_project} (UI and API agents write into the same repo) -------------
#   pw-repo-owner      the ONLY agent that writes shared repo files: package.json/lock, playwright.config.ts (defines
#                      BOTH the `ui` and `api` Playwright projects), tsconfig, .env.example, .gitignore, README,
#                      utils/shared/. Creates the skeleton (stage `playwright-repo`, spawned by orchestrator-agent)
#                      and applies change requests later (spawned by either Playwright orchestrator, never both at once).
#   pw-ui-scaffolder   the UI side's product-wide foundation, once (config/ui/, base fixtures/ui/, generic helpers/ui/).
#   pw-api-scaffolder  the API side's product-wide foundation, once (config/api/, base fixtures/api/, helpers/api/schema.ts).
#   ui side owns:  pages/, tests/ui/, helpers/ui/, fixtures/ui/, config/ui/
#   api side owns: clients/, tests/api/, helpers/api/, fixtures/api/, config/api/
#   Nobody edits another side's folders or the shared files; a needed shared change is a request the domain
#   orchestrator passes to pw-repo-owner (file hand-off, no agent-to-agent messaging).

profiles:
  # Reusable bundles; an agent lists `profile:` and any per-agent overrides replace the profile's keys.
  orchestrator:           # domain orchestrators: coordinate only, never touch the product, never write code
    spawns: []            # filled per agent
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/orchestration.mjs *", "node scripts/run.mjs status *", "node scripts/ledger.mjs list *"]
  code_writer:            # writes generated test code only, no product access
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project        # may run typecheck/lint/`k6 inspect`, never the suite against the product
  reviewer:               # reads code, writes one findings file; cannot edit the code it reviews
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project
  fixer:                  # applies reviewer findings or healable triage rows to the code (the only agent per domain
                          # that edits reviewed code); cannot run against the product
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project

agents:
  # ======================= Layer 0 ========================================================================
  orchestrator-agent:
    layer: 0
    spawns: [knowledge-generator, module-explorer, clarification-orchestrator, testcase-orchestrator,
             playwright-ui-orchestrator, playwright-api-orchestrator, k6-orchestrator, report-generator, pw-repo-owner]
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/run.mjs *", "node scripts/run-config.mjs *", "node scripts/ledger.mjs list *",
                  "node scripts/knowledge.mjs *", "node scripts/clarifications.mjs status *"]
    ask_user: allowed
    tool_search: allowed       # runs as the main session, so it can ask the human
    filesystem:
      read: ["${product_dir}/**", "config/**"]
      write: ["${state}/notes.md"]

  # ======================= Product level (spawned by the main orchestrator) ================================
  knowledge-generator:
    layer: 1
    spawns: []
    live_target: { browser: read, http: none, load: none }   # docs/web first; live product only when needed; full browser in full-run runs
    web_research: allowed
    shell: restricted           # sources, sources.md, glossary merge and inputs are script-owned
    shell_allow: ["node scripts/knowledge.mjs add-source *", "node scripts/knowledge.mjs render *",
                  "node scripts/knowledge.mjs merge-glossary *", "node scripts/knowledge.mjs check *"]
    filesystem:
      read: ["config/**", "${state}/config.resolved.json", "${knowledge}/**", "<requirement docs and references listed in the run-config>"]
      write: ["${knowledge}/overview.md", "${knowledge}/glossary.md",
              "${knowledge}/modules/${module}/overview.md", "${knowledge}/modules/${module}/glossary.md",
              "${knowledge}/modules/${module}/notes.md"]

  module-explorer:
    layer: 1
    spawns: []
    live_target: { browser: mutate, http: none, load: none }   # mutate (ledger-scoped; capped to read in readonly runs)
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/clarifications.mjs append *", "node scripts/clarifications.mjs list *",
                  "node scripts/clarifications.mjs set-steps *", "node scripts/clarifications.mjs record *",
                  "node scripts/ledger.mjs add *", "node scripts/ledger.mjs deleted *", "node scripts/ledger.mjs owns *"]
    filesystem:
      read: ["${knowledge}/**", "${modules}/**", "${state}/config.resolved.json"]
      write: ["${modules}/explore/**"]   # incl. explore/new-questions.json handed to clarifications.mjs append
    # Appends only NEW rows (new ID, Module, Question, Steps, empty Answer/notes, Run ID = this run) and refines the
    # Question/Steps of still-unanswered rows (set-steps); never edits answered rows -- EXCEPT where the incoming
    # requirement changes a behavior already recorded (then the row's Answer/notes are updated, Run ID kept as the
    # creating run). The CSV is written ONLY through scripts/clarifications.mjs (ids, de-dup, locking, human-answer
    # protection), so no agent has Write access to clarifications.csv itself.

  # ======================= Clarification domain ===========================================================
  clarification-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [clarification-explorer]
    shell_allow: ["node scripts/orchestration.mjs *", "node scripts/clarifications.mjs list *",
                  "node scripts/clarifications.mjs status *", "node scripts/clarifications.mjs summary *"]
    filesystem:
      read: ["${modules}/**"]
      write: ["${state}/orchestration/clarifications-${module}.json"]   # clarifications-summary.md is rendered by the script

  clarification-explorer:       # one invocation per CSV row: executes the Steps, observes, records the row's outcome
    layer: 2
    live_target: { browser: mutate, http: none, load: none }   # mutate (ledger-scoped); capped to read in readonly runs
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/clarifications.mjs list *", "node scripts/clarifications.mjs record *",
                  "node scripts/ledger.mjs add *", "node scripts/ledger.mjs deleted *", "node scripts/ledger.mjs owns *"]
    filesystem:
      read: ["${modules}/**", "${knowledge}/**"]
      write: ["${modules}/clarification-evidence/**"]   # observation notes + screenshots, one folder per row ID
    # Fills Answer / "Clarification agent notes" of its own row through clarifications.mjs record (single writer per
    # cell: one explorer per row); never overwrites a non-empty Answer cell (a human may have written it); Run ID
    # (creating run) is never changed.

  # ======================= Test case domain ===============================================================
  testcase-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [testcase-writer, testcase-reviewer]
    filesystem: { read: ["${modules}/**"], write: ["${state}/orchestration/testcases-${module}.json"] }

  testcase-writer:
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: none
    filesystem:
      read: ["${modules}/**", "${knowledge}/**"]
      write: ["${modules}/testcases/**"]

  testcase-reviewer:
    layer: 2
    profile: reviewer
    shell: none
    filesystem: { read: ["${modules}/**"], write: ["${results}/${module}/testcases/review-findings.md"] }

  # ======================= Shared Playwright repo owner (repo: ${pw_project}) =============================
  pw-repo-owner:                # sole writer of shared repo files (see ownership table in the header)
    layer: 2
    profile: code_writer
    web_research: allowed       # framework best-practice research for the skeleton
    filesystem:
      read: ["${pw_project}/**", "${knowledge}/**", "${state}/orchestration/**"]
      write: ["${pw_project}/package.json", "${pw_project}/package-lock.json", "${pw_project}/playwright.config.ts",
              "${pw_project}/tsconfig.json", "${pw_project}/.env.example", "${pw_project}/.gitignore",
              "${pw_project}/README.md", "${pw_project}/utils/shared/**"]

  # ======================= Playwright UI domain (repo: ${pw_project}) =====================================
  playwright-ui-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [pw-repo-owner, pw-ui-scaffolder, pw-ui-pom-writer, pw-ui-tests-writer, pw-ui-reviewer, pw-ui-fixer,
             pw-ui-test-runner-triager]
    filesystem: { read: ["${modules}/**", "${pw_project}/**", "${results}/${module}/playwright-ui/**"], write: ["${state}/orchestration/playwright-ui-${module}.json"] }

  pw-ui-scaffolder:             # the UI side's product-wide foundation, once; shared files belong to pw-repo-owner
    layer: 2
    profile: code_writer
    web_research: allowed
    filesystem:
      read: ["${pw_project}/**", "${knowledge}/**", "${modules}/**", "${state}/config.resolved.json"]
      write: ["${pw_project}/config/ui/**", "${pw_project}/fixtures/ui/**", "${pw_project}/helpers/ui/**"]
  pw-ui-pom-writer:             # page objects, plus one fixture per page object in fixtures/ui/index.ts
    layer: 2
    profile: code_writer
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${pw_project}/pages/**", "${pw_project}/fixtures/ui/index.ts"] }
  pw-ui-tests-writer:           # specs, plus the module's data builders in helpers/ui/
    layer: 2
    profile: code_writer
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${pw_project}/tests/ui/**", "${pw_project}/helpers/ui/**"] }
  pw-ui-reviewer:
    layer: 2
    profile: reviewer
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${results}/${module}/playwright-ui/review-findings.md"] }
  pw-ui-fixer:                  # review findings or healable triage rows
    layer: 2
    profile: fixer
    filesystem:
      read: ["${pw_project}/**", "${modules}/**", "${results}/${module}/playwright-ui/review-findings.md",
             "${results}/${module}/playwright-ui/triage.md"]
      write: ["${pw_project}/pages/**", "${pw_project}/tests/ui/**", "${pw_project}/helpers/ui/**", "${pw_project}/fixtures/ui/**"]
  pw-ui-test-runner-triager:
    layer: 2
    live_target: { browser: mutate, http: none, load: none }   # runs the ui project; mutating specs only in full-run, ledger-scoped
    web_research: none
    shell: project
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${results}/${module}/playwright-ui/results.json", "${results}/${module}/playwright-ui/triage.md", "${pw_project}/test-results/ui/**"] }

  # ======================= Playwright API domain (same repo: ${pw_project}) ===============================
  playwright-api-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [pw-repo-owner, api-discoverer, api-test-planner, pw-api-scaffolder, pw-api-client-writer, pw-api-tests-writer,
             pw-api-reviewer, pw-api-fixer, pw-api-test-runner-triager]
    filesystem: { read: ["${modules}/**", "${pw_project}/**", "${results}/${module}/playwright-api/**"], write: ["${state}/orchestration/playwright-api-${module}.json"] }

  api-discoverer:
    layer: 2
    live_target: { browser: none, http: read, load: none }   # fetch OpenAPI / GET endpoints
    web_research: allowed     # vendor API docs
    shell: none
    filesystem: { read: ["${knowledge}/**", "${modules}/**"], write: ["${modules}/api/discovered-endpoints.json"] }
  api-test-planner:
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: none
    filesystem: { read: ["${modules}/**"], write: ["${modules}/api/api-test-plan.md", "${modules}/api/plan.json"] }
  pw-api-scaffolder:            # the API side's product-wide foundation, once; shared files belong to pw-repo-owner
    layer: 2
    profile: code_writer
    web_research: allowed
    filesystem:
      read: ["${pw_project}/**", "${knowledge}/**", "${modules}/**", "${state}/config.resolved.json"]
      write: ["${pw_project}/config/api/**", "${pw_project}/fixtures/api/**", "${pw_project}/helpers/api/**"]
  pw-api-client-writer:        # API equivalent of the POM: typed clients per resource, their schemas, one fixture per client
    layer: 2
    profile: code_writer
    filesystem:
      read: ["${pw_project}/**", "${modules}/**"]
      write: ["${pw_project}/clients/**", "${pw_project}/config/api/schemas/**", "${pw_project}/fixtures/api/index.ts"]
  pw-api-tests-writer:          # specs, plus the module's payload builders in helpers/api/
    layer: 2
    profile: code_writer
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${pw_project}/tests/api/**", "${pw_project}/helpers/api/**"] }
  pw-api-reviewer:
    layer: 2
    profile: reviewer
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${results}/${module}/playwright-api/review-findings.md"] }
  pw-api-fixer:                 # review findings or healable triage rows
    layer: 2
    profile: fixer
    filesystem:
      read: ["${pw_project}/**", "${modules}/**", "${results}/${module}/playwright-api/review-findings.md",
             "${results}/${module}/playwright-api/triage.md"]
      write: ["${pw_project}/clients/**", "${pw_project}/tests/api/**", "${pw_project}/helpers/api/**", "${pw_project}/fixtures/api/**"]
  pw-api-test-runner-triager:
    layer: 2
    live_target: { browser: none, http: mutate, load: none }   # runs the api project; mutating tests only in full-run, ledger-scoped
    web_research: none
    shell: project
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${results}/${module}/playwright-api/results.json", "${results}/${module}/playwright-api/triage.md", "${pw_project}/test-results/api/**"] }

  # ======================= K6 domain (repo: ${k6_project}) ================================================
  k6-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [k6-workload-designer, k6-lib-writer, k6-script-writer, k6-reviewer, k6-fixer, k6-runner-triager]
    filesystem: { read: ["${modules}/**", "${k6_project}/**", "${results}/${module}/k6/**"], write: ["${state}/orchestration/k6-${module}.json"] }
  k6-workload-designer:
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: none
    filesystem: { read: ["${modules}/**", "${knowledge}/**", "${results}/${module}/playwright-api/**"], write: ["${modules}/k6/workload.json"] }
  k6-lib-writer:
    layer: 2
    profile: code_writer
    filesystem: { read: ["${k6_project}/**", "${modules}/**"], write: ["${k6_project}/lib/**", "${k6_project}/README.md"] }
  k6-script-writer:
    layer: 2
    profile: code_writer
    filesystem: { read: ["${k6_project}/**", "${modules}/**"], write: ["${k6_project}/scripts/**"] }
  k6-reviewer:
    layer: 2
    profile: reviewer
    filesystem: { read: ["${k6_project}/**", "${modules}/**"], write: ["${results}/${module}/k6/review-findings.md"] }
  k6-fixer:                     # review findings or healable triage rows
    layer: 2
    profile: fixer
    filesystem:
      read: ["${k6_project}/**", "${modules}/**", "${results}/${module}/k6/review-findings.md", "${results}/${module}/k6/triage.md"]
      write: ["${k6_project}/**"]
  k6-runner-triager:
    layer: 2
    live_target: { browser: none, http: none, load: run }   # live load only in full-run; BASE_URL must be on K6_ALLOWED_HOSTS
    web_research: none
    shell: project
    filesystem: { read: ["${k6_project}/**", "${modules}/**"], write: ["${results}/${module}/k6/results.json", "${results}/${module}/k6/triage.md", "${k6_project}/results/**"] }

  # ======================= Reporting and framework maintenance ===========================================
  report-generator:
    layer: 1
    spawns: []
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/run.mjs status *", "node scripts/report-data.mjs *"]
    filesystem: { read: ["${product_dir}/**"], write: ["${results}/report/**"] }

  feedback-implementor-agent:   # existing: fixes agent prompts / framework from feedback/ files (not generated test code)
    layer: 1
    spawns: []
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project
    filesystem:
      read: ["feedback/**", "agents/**", "docs/**", "scripts/**", "config/**"]
      write: ["agents/*.md", "docs/**", "feedback/**", "scripts/*.mjs",
              "scripts/lib/contract.mjs", "scripts/lib/clarifications.mjs", "scripts/lib/knowledge.mjs",
              "scripts/lib/testcases.mjs", "scripts/lib/csv.mjs"]
    # Never config/ (permissions, models, platforms, MCP servers), the safety code (scripts/lib/{guard,permissions,ledger,
    # hosts,tool-call,browser-tools,guard-check,decisions}.mjs, scripts/hooks/), the hook registrations or editor settings
    # (.claude/settings.json, .github/hooks/, .vscode/) or the generated agent/MCP files (rebuilt from agents/ by
    # `npm run build-agents` via its shell): safety, permissions, models and platforms are human-only decisions (D-013).
