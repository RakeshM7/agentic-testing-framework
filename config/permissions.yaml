# Per-agent permissions: the single, reviewable statement of what each agent may do, on every platform.
#
# Two things are derived from it, so a prompt can never grant more than this file:
#   1. each generated agent file's tool list and subagent allow-list, per platform (scripts/build-agents.mjs with
#      config/platforms.yaml), and
#   2. the framework guard (scripts/lib/guard.mjs), which applies the calling agent's row to every guarded tool call:
#      spawns, shell, HTTP/load, browser actions and the filesystem write allow-list. `run.mjs init` freezes this
#      file into the run's state/permissions.resolved.json, so a run's permissions cannot change under it.
# Fields are neutral capabilities, never a platform's tool names.
#
# ---- Field meanings --------------------------------------------------------------------------------------
# layer            0 = main session (orchestrator) | 1 = domain orchestrator or product-level worker | 2 = worker
# spawns           exact agent names this agent may start (its subagent allow-list); [] = cannot spawn.
#                  Workers never spawn: all communication between agents goes through the parent orchestrator,
#                  using files as the hand-off (no agent talks to a sibling).
# live_target      what the agent may do against the PRODUCT UNDER TEST (the live app):
#     browser:     none | read (navigate, observe, screenshot) | mutate (click/submit/create/edit/delete)
#     http:        none | read (GET/HEAD/OPTIONS) | mutate (POST/PUT/PATCH/DELETE)
#     load:        none | run   (execute k6 against the target)
#     Every `mutate`/`run` is ALWAYS scoped to entities the CURRENT run created (state/ledger.jsonl, entries are
#     tagged with the run id); deletes of anything else are blocked by the guard regardless of this file.
# browser_session  shared (default) | fresh -- may close its own browser session, so its next call starts clean from
#                  the saved login state (D-047). Needs browser access; changes nothing in the product.
# web_research    none | allowed -- may fetch pages from the public internet that are NOT the product under test
# shell            none | restricted (only the commands listed in `shell_allow`) | project (any command that
#                  passes the guard, e.g. npm/npx/node/k6 inspect)
# ask_user         none | allowed -- may ask the human questions (main session only; default none)
# filesystem       read / write glob lists (variables below).
#
# ---- How this combines with authorizations.mode (run-config) ---------------------------------------------
# DECIDED: the run's authorizations.mode CAPS every agent. In `readonly` runs every `mutate` / `run` below is
# automatically reduced to `read` / `none` for ALL agents (no per-agent override). In `full-run` runs the values in
# this file apply as written, except the browser: any agent with browser access (read or mutate) gets the FULL
# browser in full-run (`none` stays none). Computed by the guard (effectiveLiveTarget).
#
# ---- Variables (layout v2: everything is product-level, there is no artifacts/<run-id>/ directory) --------
variables:
  product_dir: "artifacts/${product}"
  knowledge: "artifacts/${product}/knowledge"                 # reusable per-product knowledge base
  modules: "artifacts/${product}/modules/${module}"           # per-module working files, latest state
  state: "artifacts/${product}/state"                         # run.json, ledger.jsonl, lock, orchestration/, history/
  results: "artifacts/${product}/results/${run_id}"           # per-run archive: review findings, results, triage, report
  pw_project: "playwright-tests/${product}"                   # ONE Playwright repo: tests/ui + tests/api
  k6_project: "k6-tests/${product}"
#
# ---- Decision log (the reasons and the full log: docs/decisions.md) -------------------------------------
# Mode caps permissions | knowledge-generator: live product only if needed | module-explorer: mutate
# scaffolders: web research allowed | api-discoverer: http read, shell only endpoints.mjs (D-045) | global feedback implementor: as drafted
# module-explorer: explore.mjs owns the state machine; the agent writes flows, summary, questions, overlay, captures (D-052)
# testcase-writer: testcases.mjs build/check/paths only, writes cases.json only; `testcases.mjs approve` and the approval
#   sheet (approval.csv, approvals.json) are human-only: no agent's row may grant them, and the guard denies them anyway
# foundations (D-054): pw-repo-owner, the scaffolders and k6-lib-writer run only foundation.mjs and write only their
#   overlay and extension files; every managed foundation file is in managed_files, and no agent writes one
# UI code (D-055): pw-ui-pom-writer and pw-ui-tests-writer run only ui-code.mjs build/check/paths; the pom-writer writes
#   pages/<m>/**, the tests-writer the cases spec's regions and helpers/ui/<m>.data.ts
# API code (D-056): pw-api-client-writer and pw-api-tests-writer run only api-code.mjs build/check/paths (tsc and
#   playwright --list run inside check); the generated clients, types, schemas, registration and specs are managed
#   files no caller writes; the client-writer writes its client overlay and helpers/api/<m>.composite.ts, the
#   tests-writer its tests overlay and the slots of helpers/api/<m>.payloads.ts and .glue.ts
# k6 (D-057): k6-workload-designer runs only workload.mjs build/check/paths and writes only its workload overlay;
#   k6-script-writer runs only k6-code.mjs build/check/paths (k6 inspect runs inside check) and writes only its slot file
#   scripts/slots/<m>.js; workload.json, its coverage and registry, the generated scripts, code-plan.json, parked.json
#   and legacy/ are managed files no caller writes
# triage (D-058): the three runner-triagers run triage.mjs prepare/build/check/paths and write only their
#   triage-overlay.json (classes, fix hints and the bug drafts); results.json, triage.json, triage.md, the BUG registry and
#   the human-only known-issues.json are managed files no caller writes. `prepare` only clears this module's stale run
#   output inside the paths the triager may already write (test-results/<side>/, k6 results/<m>-*)
# fixtures/<side>/index.ts (D-056): generated on both sides from the module registrations (foundation.mjs renderIndex,
#   written by foundation.mjs render and by ui-code.mjs / api-code.mjs build); managed, in no agent's write list
# review and fix (D-059): pw-ui/pw-api/k6 reviewers run only review.mjs check and write only their review.json; the fixers
#   run fix.mjs check (never snapshot) and write code in their owned files plus their fix-report.json; review-check.json,
#   fix-snapshot.json and the rendered review-findings.md are managed files no caller writes
# Limits: review rounds = 3, heal rounds = 3 | one active run per product (state/lock.json)
#
# ---- Shared-repo ownership inside ${pw_project} (UI and API agents write into the same repo) -------------
#   pw-repo-owner      the ONLY owner of the shared repo files: package.json/lock, playwright.config.ts (defines
#                      BOTH the `ui` and `api` Playwright projects), tsconfig, .env.example, .gitignore, README,
#                      utils/shared/. They are rendered from templates/ by `foundation.mjs render --side repo`, which
#                      only pw-repo-owner may run, with its repo overlay (D-054). Creates the skeleton (stage
#                      `playwright-repo`, spawned by orchestrator-agent) and applies change requests later (spawned by
#                      either Playwright orchestrator, never both at once) as structured overlay entries.
#   pw-ui-scaffolder   the UI side's product-wide foundation (config/ui/, fixtures/ui/base.ts + auth.setup.ts), rendered
#                      from its cited UI overlay; it writes only that overlay and helpers/ui/.
#   pw-api-scaffolder  the API side's (config/api/, fixtures/api/base.ts + auth.setup.ts, helpers/api/schema.ts), likewise.
#   k6-lib-writer      the k6 lib (lib/*.js, README, .gitignore), likewise; hand-written additions only in lib/ext/.
#   ui side owns:  pages/, tests/ui/, helpers/ui/, fixtures/ui/, config/ui/
#   api side owns: clients/, tests/api/, helpers/api/, fixtures/api/, config/api/
#   Nobody edits another side's folders or the shared files; a needed shared change is a request the domain
#   orchestrator passes to pw-repo-owner (file hand-off, no agent-to-agent messaging).

# ---- Managed foundation files (D-054) ------------------------------------------------------------------
# Rendered by scripts/foundation.mjs from the framework's templates/: NO agent writes one directly, whatever its
# write list says (the guard denies it). The owning agent writes its overlay (artifacts/<product>/foundation/) and
# re-renders; `foundation.mjs check` and the gate fail on a hand edit. scripts/guard.test.mjs keeps this list in step
# with the templates (every rendered file is denied to every agent). Matching ignores case, trailing dots and spaces,
# NTFS stream suffixes and ./.. segments, and covers 8.3 short names; no caller, named or not, writes one.
managed_files:
  - "${pw_project}/package.json"
  - "${pw_project}/package-lock.json"
  - "${pw_project}/playwright.config.ts"
  - "${pw_project}/tsconfig.json"
  - "${pw_project}/.gitignore"
  - "${pw_project}/.env.example"
  - "${pw_project}/README.md"
  - "${pw_project}/.foundation-managed.json"
  - "${pw_project}/utils/shared/**"
  - "${pw_project}/config/ui/settings.ts"
  - "${pw_project}/config/ui/README.md"
  - "${pw_project}/fixtures/ui/base.ts"
  - "${pw_project}/fixtures/ui/auth.setup.ts"
  # D-056: the side's test, generated from the module registrations, and the UI registrations themselves
  - "${pw_project}/fixtures/ui/index.ts"
  - "${pw_project}/fixtures/ui/pages/**"
  - "${pw_project}/config/api/settings.ts"
  - "${pw_project}/config/api/README.md"
  - "${pw_project}/fixtures/api/base.ts"
  - "${pw_project}/fixtures/api/auth.setup.ts"
  - "${pw_project}/fixtures/api/index.ts"
  - "${pw_project}/helpers/api/schema.ts"
  # API code (D-056): generated by scripts/api-code.mjs from the catalogue and the plan, drift-checked by its check
  - "${pw_project}/clients/**"
  - "${pw_project}/tests/api/**"
  - "${pw_project}/config/api/schemas/**"
  - "${pw_project}/fixtures/api/clients/**"
  - "${k6_project}/lib/*.js"
  - "${k6_project}/README.md"
  - "${k6_project}/.gitignore"
  # k6 (D-057): the workload, written by scripts/workload.mjs (the designer writes only workload-overlay.json), and the
  # scripts, written by scripts/k6-code.mjs (the script-writer writes only scripts/slots/<m>.js), per module. `*`
  # stands for the module: a managed glob can't take ${module} (any module's file is managed alike).
  - "${product_dir}/modules/*/k6/workload.json"
  - "${product_dir}/modules/*/k6/workload-coverage.json"
  - "${product_dir}/modules/*/k6/workload-registry.json"
  - "${product_dir}/modules/*/k6/code-plan.json"
  - "${product_dir}/modules/*/k6/parked.json"
  - "${product_dir}/modules/*/k6/legacy/**"
  - "${k6_project}/scripts/*.js"
  # triage (D-058): results.json by scripts/results.mjs; triage.json, triage.md and the BUG registry by scripts/triage.mjs
  # (the triager writes only triage-overlay.json); known-issues.json is edited by a human only
  - "${results}/*/*/results.json"
  - "${results}/*/*/triage.json"
  - "${results}/*/*/triage.md"
  - "${product_dir}/modules/*/triage/**"
  - "${product_dir}/known-issues.json"
  # review and fix (D-059): the reviewers write only review.json and the fixers only fix-report.json (and code); the
  # check stamps, the snapshot a fix is checked against, and the findings rendered from review.json are the scripts'
  # (testcases included: review-check renders its review-findings.md)
  - "${results}/*/*/review-check.json"
  - "${results}/*/*/fix-snapshot.json"
  - "${results}/*/*/review-findings.md"
  # worker requests (G10, D-060): written only by scripts/requests.mjs (workers add through it) and orchestration.mjs
  - "${results}/*/*/requests.json"
  # report (G11, D-061): report.json by report-data.mjs; the deck and the verified stamp by report.mjs (the agent writes
  # only report/narrative.json)
  - "${results}/report/report.json"
  - "${results}/report/index.html"
  - "${results}/report/report-check.json"

profiles:
  # Reusable bundles; an agent lists `profile:` and any per-agent overrides replace the profile's keys.
  orchestrator:           # domain orchestrators: coordinate only, never touch the product, never write code
    spawns: []            # filled per agent
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/orchestration.mjs *", "node scripts/requests.mjs list *", "node scripts/run.mjs status *", "node scripts/ledger.mjs list *"]
  code_writer:            # writes generated test code only, no product access
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project        # may run typecheck/lint/`k6 inspect`, never the suite against the product
  reviewer:               # reads code, writes one findings file; cannot edit the code it reviews
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project
  fixer:                  # applies reviewer findings or healable triage rows to the code (the only agent per domain
                          # that edits reviewed code); cannot run against the product
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project

agents:
  # ======================= Layer 0 ========================================================================
  orchestrator-agent:
    layer: 0
    spawns: [knowledge-generator, module-explorer, clarification-orchestrator, testcase-orchestrator,
             playwright-ui-orchestrator, playwright-api-orchestrator, k6-orchestrator, report-generator, pw-repo-owner]
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/run.mjs *", "node scripts/run-config.mjs *", "node scripts/ledger.mjs list *",
                  "node scripts/knowledge.mjs *", "node scripts/clarifications.mjs status *"]
    ask_user: allowed
    tool_search: allowed       # runs as the main session, so it can ask the human
    filesystem:
      read: ["${product_dir}/**", "config/**"]
      write: ["${state}/notes.md", "config/interview-answers.json"]   # the run-config interview (D-063): `run-config.mjs draft` turns it into config/<product>.yaml

  # ======================= Product level (spawned by the main orchestrator) ================================
  knowledge-generator:
    layer: 1
    spawns: []
    live_target: { browser: read, http: none, load: none }   # docs/web first; live product only when needed; full browser in full-run runs
    web_research: allowed
    shell: restricted           # sources, sources.md, glossary merge, inputs, the input ledger, the source cache and open-point ids are script-owned (D-051)
    shell_allow: ["node scripts/knowledge.mjs add-source *", "node scripts/knowledge.mjs input *",
                  "node scripts/knowledge.mjs snapshot *", "node scripts/knowledge.mjs render *",
                  "node scripts/knowledge.mjs merge-glossary *", "node scripts/knowledge.mjs check *",
                  "node scripts/knowledge.mjs paths *"]
    filesystem:
      read: ["config/**", "${state}/config.resolved.json", "${knowledge}/**", "<requirement docs and references listed in the run-config>"]
      write: ["${knowledge}/overview.md", "${knowledge}/glossary.md", "${knowledge}/captures/**",
              "${knowledge}/modules/${module}/overview.md", "${knowledge}/modules/${module}/glossary.md",
              "${knowledge}/modules/${module}/notes.md"]

  module-explorer:
    layer: 1
    spawns: []
    live_target: { browser: mutate, http: none, load: none }   # mutate (ledger-scoped; capped to read in readonly runs)
    web_research: none
    shell: restricted           # states, pages, the frontier, the network inventory, ids and the question audit are script-owned (D-052)
    shell_allow: ["node scripts/explore.mjs *",
                  "node scripts/clarifications.mjs append *", "node scripts/clarifications.mjs list *",
                  "node scripts/clarifications.mjs set-steps *", "node scripts/clarifications.mjs record *",
                  "node scripts/ledger.mjs add *", "node scripts/ledger.mjs deleted *", "node scripts/ledger.mjs owns *"]
    filesystem:
      read: ["${knowledge}/**", "${modules}/**", "${state}/config.resolved.json"]
      # only the agent's own explore files; everything else in explore/ is written by scripts/explore.mjs
      write: ["${modules}/explore/flows/**", "${modules}/explore/module-summary.md", "${modules}/explore/new-questions.json",
              "${modules}/explore/overlay.json", "${modules}/explore/captures/**"]
    # Appends only NEW rows (new ID, Module, Question, Steps, empty Answer/notes, Run ID = this run) and refines the
    # Question/Steps of still-unanswered rows (set-steps); never edits answered rows -- EXCEPT where the incoming
    # requirement changes a behavior already recorded (then the row's Answer/notes are updated, Run ID kept as the
    # creating run). The CSV is written ONLY through scripts/clarifications.mjs (ids, de-dup, locking, human-answer
    # protection), so no agent has Write access to clarifications.csv itself.

  # ======================= Clarification domain ===========================================================
  clarification-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [clarification-explorer]
    shell_allow: ["node scripts/orchestration.mjs *", "node scripts/clarifications.mjs list *", "node scripts/clarifications.mjs status *"]
    filesystem:
      read: ["${modules}/**"]
      write: ["${state}/orchestration/clarifications-${module}.json"]   # clarifications-summary.md is rendered by orchestration.mjs next

  clarification-explorer:       # one invocation per CSV row: executes the Steps, observes, records the row's outcome
    layer: 2
    live_target: { browser: mutate, http: none, load: none }   # mutate (ledger-scoped); capped to read in readonly runs
    browser_session: fresh      # closes its browser session after each row, so every row starts clean (D-047)
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/clarifications.mjs list *", "node scripts/clarifications.mjs record *",
                  "node scripts/ledger.mjs add *", "node scripts/ledger.mjs deleted *", "node scripts/ledger.mjs owns *"]
    filesystem:
      read: ["${modules}/**", "${knowledge}/**"]
      write: ["${modules}/clarification-evidence/**"]   # observation, captures, outcome.json; one folder per row ID
    # Records its own row through `clarifications.mjs record --file outcome.json` (single writer per cell: one explorer
    # per row): the script checks the outcome against the evidence, writes the Answer as agent-proposed or the notes,
    # and appends the outcome's follow-up questions for the next run (D-048). Never overwrites a non-empty Answer cell
    # (a human may have written it); Run ID (creating run) is never changed.

  # ======================= Test case domain ===============================================================
  testcase-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [testcase-writer, testcase-reviewer]
    filesystem: { read: ["${modules}/**"], write: ["${state}/orchestration/testcases-${module}.json"] }

  testcase-writer:              # the TC/CI ids, coverage ledger, budget, renders, summary and approval sheet are script-owned (testcases.mjs)
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted           # never `testcases.mjs approve`: approval is human-only, and the guard denies it to every agent
    shell_allow: ["node scripts/testcases.mjs build *", "node scripts/testcases.mjs check *", "node scripts/testcases.mjs paths *"]
    filesystem:
      read: ["${modules}/**", "${knowledge}/**", "${results}/${module}/testcases/review-findings.md",
             "${results}/${module}/testcases/gate-findings.md"]
      write: ["${modules}/testcases/cases.json"]   # only its cases overlay; never approval.csv or approvals.json

  testcase-reviewer:            # D-053: writes only its per-case verdicts; testcases.mjs review-check derives the verdict and review-findings.md
    layer: 2
    profile: reviewer
    shell: restricted
    shell_allow: ["node scripts/testcases.mjs review-check *"]
    filesystem: { read: ["${modules}/**", "${knowledge}/**", "${results}/${module}/testcases/gate-findings.md"], write: ["${results}/${module}/testcases/review.json"] }

  # ======================= Shared Playwright repo owner (repo: ${pw_project}) =============================
  pw-repo-owner:                # sole owner of the shared repo files (ownership table in the header). D-054: they are
    layer: 2                    # rendered from templates/ with its repo overlay; only it may render --side repo
    live_target: { browser: none, http: none, load: none }
    web_research: allowed       # framework best-practice research for the skeleton
    shell: restricted
    shell_allow: ["node scripts/foundation.mjs render * --side repo", "node scripts/foundation.mjs check *",
                  "node scripts/foundation.mjs paths *", "node scripts/foundation.mjs install *"]
    filesystem:
      read: ["${pw_project}/**", "${knowledge}/**", "${state}/orchestration/**", "${product_dir}/foundation/**",
             "${state}/config.resolved.json", "${results}/*/*/requests.json"]
      write: ["${product_dir}/foundation/repo-overlay.json"]

  # ======================= Playwright UI domain (repo: ${pw_project}) =====================================
  playwright-ui-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [pw-repo-owner, pw-ui-scaffolder, pw-ui-pom-writer, pw-ui-tests-writer, pw-ui-reviewer, pw-ui-fixer,
             pw-ui-test-runner-triager]
    filesystem: { read: ["${modules}/**", "${pw_project}/**", "${results}/${module}/playwright-ui/**"], write: ["${state}/orchestration/playwright-ui-${module}.json"] }

  pw-ui-scaffolder:             # D-054: the UI foundation is rendered from templates/ with its cited UI overlay
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: allowed
    shell: restricted
    shell_allow: ["node scripts/foundation.mjs render * --side ui", "node scripts/foundation.mjs check *",
                  "node scripts/foundation.mjs paths *", "node scripts/requests.mjs add *"]
    filesystem:
      read: ["${pw_project}/**", "${knowledge}/**", "${modules}/**", "${state}/config.resolved.json", "${product_dir}/foundation/**"]
      write: ["${product_dir}/foundation/ui-overlay.json", "${pw_project}/helpers/ui/**"]
  pw-ui-pom-writer:             # D-055: ui-code.mjs scaffolds; it writes the module's page objects and registers their fixtures
    layer: 2
    profile: code_writer
    shell: restricted           # tsc and playwright --list run inside `ui-code.mjs check` (a restricted row can't vouch for npx in the product's repo)
    shell_allow: ["node scripts/ui-code.mjs build *", "node scripts/ui-code.mjs check *", "node scripts/ui-code.mjs paths *", "node scripts/requests.mjs add *"]
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${pw_project}/pages/${module}/**"] }
  pw-ui-tests-writer:           # D-055: fills the step regions of the generated cases spec, plus the module's data builders
    layer: 2
    profile: code_writer
    shell: restricted
    shell_allow: ["node scripts/ui-code.mjs build *", "node scripts/ui-code.mjs check *", "node scripts/ui-code.mjs paths *", "node scripts/requests.mjs add *"]
    # the generated smoke (tests/ui/<m>/_locators.smoke.spec.ts) and registration (fixtures/ui/pages/<m>.ts) are the script's
    filesystem: { read: ["${pw_project}/**", "${modules}/**"], write: ["${pw_project}/tests/ui/${module}/cases.spec.ts", "${pw_project}/helpers/ui/${module}.data.ts"] }
  pw-ui-reviewer:                  # D-059: writes only its per-test verdicts; review.mjs check derives the verdict and review-findings.md
    layer: 2
    profile: reviewer
    shell: restricted
    shell_allow: ["node scripts/review.mjs check *"]
    filesystem: { read: ["${pw_project}/**", "${modules}/**", "${results}/${module}/playwright-ui/gate-findings.md"], write: ["${results}/${module}/playwright-ui/review.json"] }
  pw-ui-fixer:                  # review findings or healable triage rows
    layer: 2
    profile: fixer
    # D-055: re-renders the smoke and re-checks after a fix (shell: project already allows it; listed for the record and
    # for the run's combined ceiling). D-059: answers every finding in fix-report.json and runs fix.mjs check (the
    # snapshot it checks against is taken by orchestration.mjs, not by the fixer).
    shell_allow: ["node scripts/ui-code.mjs build *", "node scripts/ui-code.mjs check *", "node scripts/ui-code.mjs paths *", "node scripts/fix.mjs check *"]
    filesystem:
      read: ["${pw_project}/**", "${modules}/**", "${results}/${module}/playwright-ui/review-findings.md", "${results}/${module}/playwright-ui/review.json",
             "${results}/${module}/playwright-ui/gate-findings.md", "${results}/${module}/playwright-ui/triage.md", "${results}/${module}/playwright-ui/triage.json"]
      write: ["${pw_project}/pages/**", "${pw_project}/tests/ui/**", "${pw_project}/helpers/ui/**", "${results}/${module}/playwright-ui/fix-report.json"]
  pw-ui-test-runner-triager:
    layer: 2
    live_target: { browser: mutate, http: none, load: none }   # runs the ui project; mutating specs only in full-run, ledger-scoped
    web_research: none
    shell: project              # runs the suite; listed for the record and the run's combined ceiling
    shell_allow: ["node scripts/triage.mjs prepare *", "node scripts/triage.mjs build *", "node scripts/triage.mjs check *", "node scripts/triage.mjs paths *"]
    filesystem: { read: ["${pw_project}/**", "${modules}/**", "${product_dir}/known-issues.json"], write: ["${results}/${module}/playwright-ui/triage-overlay.json", "${pw_project}/test-results/ui/**"] }

  # ======================= Playwright API domain (same repo: ${pw_project}) ===============================
  playwright-api-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [pw-repo-owner, api-discoverer, api-test-planner, pw-api-scaffolder, pw-api-client-writer, pw-api-tests-writer,
             pw-api-reviewer, pw-api-fixer, pw-api-test-runner-triager]
    filesystem: { read: ["${modules}/**", "${pw_project}/**", "${results}/${module}/playwright-api/**"], write: ["${state}/orchestration/playwright-api-${module}.json"] }

  api-discoverer:               # D-045: the catalogue, coverage, drift, ids and probes are script-owned (endpoints.mjs)
    layer: 2
    live_target: { browser: none, http: read, load: none }   # fetch OpenAPI / GET endpoints; endpoints.mjs probes GET-only
    web_research: allowed     # vendor API docs
    shell: restricted
    shell_allow: ["node scripts/endpoints.mjs *"]
    filesystem: { read: ["${knowledge}/**", "${modules}/**"], write: ["${modules}/api/overlay.json"] }
  api-test-planner:             # D-046: plan.json, its coverage, ids, questions and api-test-plan.md are script-owned (api-plan.mjs)
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/api-plan.mjs *"]
    filesystem: { read: ["${modules}/**", "${knowledge}/**"], write: ["${modules}/api/plan-overlay.json"] }
  pw-api-scaffolder:            # D-054: the API foundation is rendered from templates/ with its cited API overlay
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: allowed
    shell: restricted
    shell_allow: ["node scripts/foundation.mjs render * --side api", "node scripts/foundation.mjs check *",
                  "node scripts/foundation.mjs paths *", "node scripts/requests.mjs add *"]
    filesystem:
      read: ["${pw_project}/**", "${knowledge}/**", "${modules}/**", "${state}/config.resolved.json", "${product_dir}/foundation/**"]
      write: ["${product_dir}/foundation/api-overlay.json", "${pw_project}/helpers/api/**"]
  pw-api-client-writer:        # D-056: api-code.mjs generates the clients; it writes a cited overlay, composite helpers, the registration
    layer: 2
    profile: code_writer
    shell: restricted           # tsc runs inside `api-code.mjs check` (a restricted row can't vouch for npx in the product's repo)
    shell_allow: ["node scripts/api-code.mjs build *", "node scripts/api-code.mjs check *", "node scripts/api-code.mjs paths *", "node scripts/requests.mjs add *"]
    filesystem:
      read: ["${pw_project}/**", "${modules}/**", "${knowledge}/**"]
      write: ["${modules}/api-code/client-overlay.json", "${pw_project}/helpers/api/${module}.composite.ts"]
  pw-api-tests-writer:          # D-056: api-code.mjs generates one test per plan scenario; it fills the payload and glue slots
    layer: 2
    profile: code_writer
    shell: restricted           # tsc and playwright --list run inside `api-code.mjs check`
    shell_allow: ["node scripts/api-code.mjs build *", "node scripts/api-code.mjs check *", "node scripts/api-code.mjs paths *", "node scripts/requests.mjs add *"]
    # the generated specs (tests/api/<m>/) are managed files: the slots live in the two helper files
    filesystem:
      read: ["${pw_project}/**", "${modules}/**", "${knowledge}/**"]
      write: ["${modules}/api-code/tests-overlay.json", "${pw_project}/helpers/api/${module}.payloads.ts", "${pw_project}/helpers/api/${module}.glue.ts"]
  pw-api-reviewer:                  # D-059: writes only its per-test verdicts; review.mjs check derives the verdict and review-findings.md
    layer: 2
    profile: reviewer
    shell: restricted
    shell_allow: ["node scripts/review.mjs check *"]
    filesystem: { read: ["${pw_project}/**", "${modules}/**", "${results}/${module}/playwright-api/gate-findings.md"], write: ["${results}/${module}/playwright-api/review.json"] }
  pw-api-fixer:                 # review findings or healable triage rows
    layer: 2
    profile: fixer
    # D-056: re-generates and re-checks after a fix (shell: project already allows it; listed for the record and for the
    # run's combined ceiling). The generated files are managed: a fix goes in an overlay or a slot. D-059: answers every
    # finding in fix-report.json and runs fix.mjs check (the snapshot is taken by orchestration.mjs).
    shell_allow: ["node scripts/api-code.mjs build *", "node scripts/api-code.mjs check *", "node scripts/api-code.mjs paths *", "node scripts/fix.mjs check *"]
    filesystem:
      read: ["${pw_project}/**", "${modules}/**", "${results}/${module}/playwright-api/review-findings.md", "${results}/${module}/playwright-api/review.json",
             "${results}/${module}/playwright-api/gate-findings.md", "${results}/${module}/playwright-api/triage.md", "${results}/${module}/playwright-api/triage.json"]
      # D-056: the API code is generated; the fixer edits only what an agent may write there: the slots of the
      # payload and glue files, the composite helpers and the scaffolder's helpers/api/<topic>.ts files
      write: ["${pw_project}/helpers/api/**", "${results}/${module}/playwright-api/fix-report.json"]
  pw-api-test-runner-triager:
    layer: 2
    live_target: { browser: none, http: mutate, load: none }   # runs the api project; mutating tests only in full-run, ledger-scoped
    web_research: none
    shell: project
    shell_allow: ["node scripts/triage.mjs prepare *", "node scripts/triage.mjs build *", "node scripts/triage.mjs check *", "node scripts/triage.mjs paths *"]
    filesystem: { read: ["${pw_project}/**", "${modules}/**", "${product_dir}/known-issues.json"], write: ["${results}/${module}/playwright-api/triage-overlay.json", "${pw_project}/test-results/api/**"] }

  # ======================= K6 domain (repo: ${k6_project}) ================================================
  k6-orchestrator:
    layer: 1
    profile: orchestrator
    spawns: [k6-workload-designer, k6-lib-writer, k6-script-writer, k6-reviewer, k6-fixer, k6-runner-triager]
    filesystem: { read: ["${modules}/**", "${k6_project}/**", "${results}/${module}/k6/**"], write: ["${state}/orchestration/k6-${module}.json"] }
  k6-workload-designer:         # D-057: workload.mjs builds workload.json; it writes a cited overlay
    layer: 2
    live_target: { browser: none, http: none, load: none }   # never load during design
    web_research: none
    shell: restricted
    shell_allow: ["node scripts/workload.mjs build *", "node scripts/workload.mjs check *", "node scripts/workload.mjs paths *"]
    filesystem:
      read: ["${modules}/**", "${knowledge}/**", "${results}/${module}/playwright-api/**", "${state}/config.resolved.json"]
      write: ["${modules}/k6/workload-overlay.json"]
  k6-lib-writer:                # D-054: the k6 lib is rendered from templates/ with its cited k6 overlay
    layer: 2
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted           # check --side k6 runs k6 inspect through its own temp file
    shell_allow: ["node scripts/foundation.mjs render * --side k6", "node scripts/foundation.mjs check *",
                  "node scripts/foundation.mjs paths *"]
    filesystem:
      read: ["${k6_project}/**", "${modules}/**", "${knowledge}/**", "${state}/config.resolved.json", "${product_dir}/foundation/**"]
      write: ["${product_dir}/foundation/k6-overlay.json", "${k6_project}/lib/ext/**"]
  k6-script-writer:             # D-057: k6-code.mjs generates one script per workload scenario; it fills the slots
    layer: 2
    profile: code_writer
    shell: restricted           # k6 inspect runs inside `k6-code.mjs check`
    shell_allow: ["node scripts/k6-code.mjs build *", "node scripts/k6-code.mjs check *", "node scripts/k6-code.mjs paths *", "node scripts/requests.mjs add *"]
    filesystem: { read: ["${k6_project}/**", "${modules}/**"], write: ["${k6_project}/scripts/slots/${module}.js"] }
  k6-reviewer:                  # D-059: writes only its per-test verdicts; review.mjs check derives the verdict and review-findings.md
    layer: 2
    profile: reviewer
    shell: restricted
    shell_allow: ["node scripts/review.mjs check *"]
    filesystem: { read: ["${k6_project}/**", "${modules}/**", "${results}/${module}/k6/gate-findings.md"], write: ["${results}/${module}/k6/review.json"] }
  k6-fixer:                     # review findings or healable triage rows
    layer: 2
    profile: fixer
    # D-057: the scripts are generated; a fix goes in the slot file or lib/ext/, then k6-code.mjs build and check.
    # S7-F1: shell restricted to the writer's commands, so no shell command can write a generated script. D-059: plus
    # fix.mjs check; it answers every finding in fix-report.json (the snapshot is taken by orchestration.mjs).
    shell: restricted
    shell_allow: ["node scripts/k6-code.mjs build *", "node scripts/k6-code.mjs check *", "node scripts/k6-code.mjs paths *", "node scripts/fix.mjs check *"]
    filesystem:
      read: ["${k6_project}/**", "${modules}/**", "${results}/${module}/k6/review-findings.md", "${results}/${module}/k6/review.json", "${results}/${module}/k6/gate-findings.md",
             "${results}/${module}/k6/triage.md", "${results}/${module}/k6/triage.json"]
      write: ["${k6_project}/scripts/slots/${module}.js", "${k6_project}/lib/ext/**", "${results}/${module}/k6/fix-report.json"]
  k6-runner-triager:
    layer: 2
    live_target: { browser: none, http: none, load: run }   # live load only in full-run; BASE_URL must be on K6_ALLOWED_HOSTS
    web_research: none
    shell: project
    shell_allow: ["node scripts/triage.mjs prepare *", "node scripts/triage.mjs build *", "node scripts/triage.mjs check *", "node scripts/triage.mjs paths *"]
    filesystem: { read: ["${k6_project}/**", "${modules}/**", "${product_dir}/known-issues.json"], write: ["${results}/${module}/k6/triage-overlay.json", "${k6_project}/results/**"] }

  # ======================= Reporting and framework maintenance ===========================================
  report-generator:
    layer: 1
    spawns: []
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: restricted
    # G11 (D-061): writes only its cited narrative overlay; report-data.mjs collects report.json, report.mjs renders the
    # deck and checks the narrative (report.json, index.html and the report-check.json stamp are managed files)
    shell_allow: ["node scripts/report-data.mjs *", "node scripts/report.mjs render *", "node scripts/report.mjs check *", "node scripts/report.mjs paths *"]
    filesystem: { read: ["${product_dir}/**"], write: ["${results}/report/narrative.json"] }

  feedback-implementor-agent:   # existing: fixes agent prompts / framework from feedback/ files (not generated test code)
    layer: 1
    spawns: []
    live_target: { browser: none, http: none, load: none }
    web_research: none
    shell: project
    filesystem:
      read: ["feedback/**", "agents/**", "docs/**", "scripts/**", "config/**", "schemas/**", "templates/**"]
      write: ["agents/*.md", "agents/_shared/*.md", "docs/**", "feedback/**", "scripts/api-code.mjs",
              "scripts/api-code.test.mjs", "scripts/api-plan.mjs", "scripts/api-plan.test.mjs",
              "scripts/build-agents.mjs", "scripts/build-agents.test.mjs", "scripts/clarifications.mjs",
              "scripts/clarifications.test.mjs", "scripts/decisions.test.mjs", "scripts/doctor.mjs",
              "scripts/doctor.test.mjs", "scripts/domains.test.mjs",
              "scripts/endpoints.mjs", "scripts/endpoints.test.mjs", "scripts/explore.mjs", "scripts/explore.test.mjs",
              "scripts/fix.mjs", "scripts/fix.test.mjs", "scripts/foundation.mjs", "scripts/foundation.test.mjs",
              "scripts/gate.mjs", "scripts/gate.test.mjs", "scripts/k6-code.mjs", "scripts/k6-code.test.mjs",
              "scripts/knowledge.mjs", "scripts/knowledge.test.mjs", "scripts/orchestration.mjs",
              "scripts/orchestration.test.mjs", "scripts/report-data.mjs", "scripts/report.mjs",
              "scripts/report.test.mjs", "scripts/requests.mjs", "scripts/results.mjs", "scripts/review.mjs",
              "scripts/review.test.mjs", "scripts/run-config.mjs", "scripts/run-config.test.mjs", "scripts/run.mjs",
              "scripts/run.test.mjs", "scripts/shared-libs.test.mjs", "scripts/test-helpers.mjs",
              "scripts/testcases.mjs", "scripts/testcases.test.mjs", "scripts/triage.mjs", "scripts/triage.test.mjs",
              "scripts/ui-code.mjs", "scripts/ui-code.test.mjs", "scripts/workload.mjs", "scripts/workload.test.mjs",
              "scripts/lib/api-code.mjs", "scripts/lib/api-discovery.mjs", "scripts/lib/api-plan.mjs",
              "scripts/lib/citations.mjs", "scripts/lib/clarifications.mjs", "scripts/lib/contract.mjs",
              "scripts/lib/coverage.mjs", "scripts/lib/csv.mjs", "scripts/lib/doctor.mjs", "scripts/lib/domain-flows.mjs",
              "scripts/lib/endpoints.mjs", "scripts/lib/explore.mjs", "scripts/lib/fix.mjs",
              "scripts/lib/foundation.mjs", "scripts/lib/graphql.mjs", "scripts/lib/k6-code.mjs",
              "scripts/lib/knowledge.mjs", "scripts/lib/mcp.mjs", "scripts/lib/openapi.mjs", "scripts/lib/probe.mjs",
              "scripts/lib/registry.mjs", "scripts/lib/report.mjs", "scripts/lib/requests.mjs", "scripts/lib/run-config-draft.mjs",
              "scripts/lib/review.mjs", "scripts/lib/testcases.mjs", "scripts/lib/triage.mjs",
              "scripts/lib/ts-scan.mjs", "scripts/lib/ui-code.mjs", "scripts/lib/verified.mjs",
              "scripts/lib/workload.mjs", "scripts/lib/gate/*.mjs", "scripts/fixtures/**", "schemas/*.json",
              "templates/**"]
    # G12 (D-062): the write list is enumerated because a glob has no exclude; it covers the scripts, libs, gate rules,
    # fixtures, schemas and templates of G0-G11 and leaves out the safety files below, which stay human-only.
    # Never config/ (permissions, models, platforms, MCP servers), the safety code (scripts/lib/{guard,permissions,ledger,
    # hosts,tool-call,browser-tools,guard-check,decisions,hook-registrations,hook-log,agent-scope}.mjs, scripts/hooks/, scripts/lib/agents/),
    # the checker it is checked by (scripts/{feedback,ledger}.mjs, scripts/lib/feedback.mjs, scripts/{feedback,guard,hooks,roster}.test.mjs),
    # the hook registrations or editor settings
    # (.claude/settings.json, .github/hooks/, .vscode/) or the generated agent/MCP files (rebuilt from agents/ by
    # `npm run build-agents` via its shell): safety, permissions, models and platforms are human-only decisions (D-013).
