# Agentic Testing Framework — run configuration: FULL-PRODUCT run
#
# `feature.slug: full-product` switches orchestrator-agent into full-product
# mode instead of testing one feature:
#   1. explore-agent (role: discover) maps the whole product: it researches the
#      vendor's docs/knowledge base, walks the live navigation, and writes
#      artifacts/<slug>/discovery/modules.json + product-overview.md.
#   2. explore-agent (role: module) explores each module thoroughly, one module
#      per subagent, saving sitemaps, per-page captures and flows/ (step-by-step
#      "how to do X in this app") under artifacts/<slug>/modules/<module>/explore/.
#   3. One pipeline TRACK per module (clarifications -> test cases -> Playwright
#      -> API tests), each with its own goal, run in parallel.
# Full schema: docs/conventions.md, "Full-product runs".
#
# Currently filled in for the Freshsales (Freshworks CRM) trial tenant below. To use it for another
# product, copy the file and change target.url/product, the two authorization paths and the answers.
# Invoke orchestrator-agent with this file's path. Never put secret VALUES here — only paths to
# credential/session files.

target:
  url: https://rakesh-freshsales-ind-sep21.myfreshworks.com/
  # slug: rakesh-freshsales-ind-sep21     # derived from url's hostname (artifacts/<slug>/ lives under it)
  product: freshsales                      # folder name for ALL of this product's Playwright code:
                                           # playwright-tests/freshsales/ (already exists — new modules are
                                           # added to that project). A different product gets its own folder.
  # target.maxPages / maxDepth are not used for the per-module crawl in this mode;
  # see full_product.per_module below.

feature:
  slug: full-product            # <- the trigger. Do not rename.
  description: >
    Whole-product coverage. Each discovered module gets its own track and goal.
  requirement_docs: []          # optional: docs that apply to every track

# Everything below is optional; the values shown are the defaults.
full_product:
  max_modules: 20               # more selected modules than this => the run HALTS and asks you to narrow
                                # with include/exclude (it never silently truncates)
  explore_concurrency: 1        # module explorers at once. Claude flavor: each gets its own isolated Playwright
                                # server (explore-agent mcpServers frontmatter), so raising this is safe for browser state;
                                # default 1 = lighter on resources and on the tenant. Copilot flavor: keep 1 (shared browser)
  max_parallel_tracks: 4        # pipeline tracks in flight at once
  per_module:
    maxPages: 40                # crawl budget per module explorer
    maxDepth: 4
  modules:
    include:                    # module slugs from discovery/modules.json; empty = all reachable ones
      - dashboards
      - contacts
      - accounts
      - deals
      - conversations
      - analytics
      - products-quotes
      - sales-sequences
      - sales-activities
      - settings-data-model
      - settings-pipelines-forecasting
      - settings-teams-territories
    exclude:                    # unreachable on this tenant/plan (403 / Page Not Found); the orchestrator drops these
      - marketing-lists
      - workflows
  knowledge_urls:               # help-center / API-doc URLs for the discovery agent to read first
    - https://crmsupport.freshworks.com/support/solutions   # Freshworks CRM knowledge base (verify it still resolves)
    - https://developers.freshworks.com/crm/api/            # Freshworks CRM API reference (verify it still resolves)
  clarifications:
    csv_threshold: 5            # more open questions than this across ALL modules => they are written to
                                # artifacts/<slug>/clarifications/questions.csv (orchestrator-only) and a separate
                                # answers/answers-NNN.csv sheet that YOU fill in; modules resume as soon as
                                # their own rows in the sheet are answered
    max_rounds: 5               # question rounds per module; still unresolved after this => module "uncovered"

authorizations:
  mode: readonly                # readonly (default) | full-run — applies to EVERY track. full-run lets
                                # every track mutate this tenant in parallel (deletes still scoped to
                                # entities that track itself created). Set it only on a tenant you own —
                                # this is your own trial tenant, so flip it to full-run for a real run;
                                # in readonly the explorers record forms without submitting them.
  authenticated_crawl: true
  credentials_file: playwright-tests/freshsales/.env.freshsales             # a FILE PATH, never inline values
  session_state_file: playwright-tests/freshsales/.auth/freshsales-handoff.json  # pre-authenticated storageState a human
                                # produced (login + reCAPTCHA done by hand). It expires: if explorers hit the
                                # login wall, re-capture it. Keep it equal to the --storage-state arg in
                                # claude-agents/explore-agent.md's mcpServers entry.

testcases:
  output_format: csv            # markdown-table | gherkin | csv | testrail

defaults:
  unconfirmed_behavior_policy: assume-standard-and-flag
  unconfirmed_edge_case_policy: flag-as-unconfirmed-case

# Applied to every track's Pass-1 questions (first substring match wins). Per-module questions vary
# a lot, so keep these generic; an unanswered [Blocking] question halts only that one track.
answers:
  - match: "output format"
    answer: "CSV."
  - match: "authorizations.mode"
    answer: "Use the run-config's authorizations.mode exactly as set; this is the user's own tenant."
  - match: "Validation-only negative"
    answer: >
      Yes, include them (missing required field, invalid format, boundary length) and record the
      observed error messages.
  # Freshsales specifics already known from earlier runs on this tenant:
  - match: "Leads module"
    answer: >
      This tenant/role gets a 403 on the Leads module. Treat a lead as a Contact in an early lifecycle
      stage (Status=New/Lifecycle=Lead) and cover that instead; add no dedicated test for the 403.

feedback_loop:
  auto_invoke_implementor: false

git:
  auto_commit: false
