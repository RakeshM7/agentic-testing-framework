# Agentic Testing Framework -- run configuration (layout v2)
#
# Copy this file (e.g. to config/<product>.yaml), fill it in, then:
#   node scripts/run.mjs init config/<product>.yaml
# Validate without starting a run:  node scripts/run-config.mjs validate config/<product>.yaml
#
# Never put secret VALUES in this file -- only paths to files a human prepared.

# Product slug: the folder name under artifacts/, playwright-tests/ and k6-tests/. All knowledge, clarifications
# and run state for this product accumulate under artifacts/<product>/ across runs.
product: acme-crm

target:
  url: https://crm.example.com
  api_urls: []                  # optional: API hosts of the same product, e.g. https://api.crm.example.com/v2. The guard
                                # treats them as the target (http rules apply; web research cannot reach them).

# Optional: API discovery (api-discoverer via scripts/endpoints.mjs; every request is a guarded GET).
api:
  specs: []                     # OpenAPI/Swagger documents (repo paths or URLs) a human knows of; well-known paths are tried too
  graphql: []                   # GraphQL endpoints (paths or URLs); introspection is sent over GET only
  auth_header: null             # e.g. {name: Authorization, env: CRM_API_TOKEN, prefix: "Bearer "} -- the VARIABLE NAME in
                                # credentials_file, never the value. Probes also send the session_state_file cookies.
  discovery_budget: 40          # max requests to find specs / introspect, per module
  probe_budget: 50              # max GET probes of documented endpoints, per module
  probe_delay_ms: 500           # pause between requests
  plan_budget: 300              # max API test plan scenarios per module; the lowest-priority boundary/http ones go first

# Optional: the feature / requirement driving this run. An incoming requirement that changes a behavior already
# recorded in clarifications.csv is the ONLY reason an answered row gets updated.
feature:
  description: >
    Contact management: create, edit, merge and delete contacts.
  requirement_docs: []          # paths or URLs to requirement documents / mockups

# Product-wide sources for the knowledge-generator (vendor docs, knowledge bases, help centers, internal docs).
# Knowledge is reused across runs unless these, the requirement docs (incl. local file content), a module's own
# entry below, or its `references` change.
knowledge:
  references:
    - https://crm.example.com
  max_extra_sources: 20         # per knowledge pass: extra vendor-doc, knowledge-base or web sources beyond the
                                # configured inputs. Over the cap a source is recorded `deferred: budget`, not used.
                                # Requirement docs, references and live-product pages never count (D-051).

# Exploration budgets, per module (module-explorer via scripts/explore.mjs, D-052). A new state or page over the
# budget is recorded as a `deferred: budget` frontier item, never dropped; transitions into known states always count.
explore:
  max_pages: 40                 # distinct page templates (URL paths with ids erased)
  max_states: 150               # distinct UI states (page + structural fingerprint of the accessibility snapshot)

# Modules to explore, in this order. Required: the knowledge-generator does not decide modules.
modules:
  - slug: contacts
    name: Contacts
    entry_url: https://crm.example.com/contacts
    nav_path: [Contacts]
    references: []              # optional module-specific sources; a change regenerates only this module's knowledge
  - slug: deals
    name: Deals
    nav_path: [Deals]

authorizations:
  mode: readonly                # readonly (default) | full-run
                                # readonly = EVERY agent is capped at read-only, whatever config/permissions.yaml says.
                                # full-run = config/permissions.yaml applies as written. Set it only for a target you
                                #            own or are explicitly authorized to test. Even then, deletes are limited to
                                #            entities the current run created (artifacts/<product>/state/ledger.jsonl).
  authenticated_crawl: false    # true = browser agents start from session_state_file below
  credentials_file: null        # e.g. playwright-tests/<product>/.env -- a FILE PATH, never inline values
  session_state_file: null      # e.g. playwright-tests/<product>/.auth/state.json -- Playwright storageState a human
                                # produced by logging in (incl. any CAPTCHA/MFA) once, out-of-band
  identities: []                # optional further test users, for the API plan's authorization scenarios (OWASP
                                # API1 another user's object, API5 a role without the right). FILE PATHS only, e.g.
                                # - {name: peer, role: peer, session_state_file: playwright-tests/<product>/.auth/peer.json}
                                # - {name: viewer, role: read-only, credentials_file: playwright-tests/<product>/.env.viewer}
                                # Without them those scenarios are planned as "needs an identity" and not run.

permissions_file: config/permissions.yaml   # per-agent ceilings; frozen into state/ at `run.mjs init`

testcases:
  output_format: gherkin        # markdown-table | gherkin | csv | testrail

clarifications:
  unresolved_policy: stop       # stop             = the clarifications stage is not complete until every row has an
                                #                    Answer (a human fills the Answer column, then re-invoke)
                                # continue-flagged = unanswered rows (with agent notes) are allowed; downstream
                                #                    agents treat them as flagged assumptions

limits:
  review_rounds: 3              # reviewer -> fixer loops per domain
  heal_rounds: 3                # runner-triager -> fixer loops per domain

concurrency:
  modules: 1                    # modules explored/processed in parallel (1 = sequential, one browser)
  clarification_rows: 1         # ignored: clarification rows run one at a time, each in a fresh browser session (D-047)

feedback_loop:
  auto_invoke_implementor: false

git:
  auto_commit: false
