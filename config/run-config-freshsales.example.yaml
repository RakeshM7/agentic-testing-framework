# Agentic Testing Framework — run configuration: Freshsales CRM
#
# Freshsales (Freshworks CRM, https://www.freshworks.com/crm/) is a
# multi-tenant SaaS CRM. Each account gets its own subdomain
# (e.g. https://your-company.freshsales.io) provisioned via a 21-day free
# trial at https://www.freshworks.com/crm/signup/ — there is no shared
# public instance to crawl. Sign up for your own trial tenant first, then
# replace target.url below with that tenant's URL before running.
#
# Core object model this config targets: Leads -> Contacts/Accounts -> Deals,
# moved across a Kanban sales pipeline, plus the built-in
# activities/tasks and email/call logging tied to each record.
#
# Copy this file, fill in your own trial tenant + credentials, and invoke
# orchestrator-agent with that path. Never put actual secret VALUES in this
# file — only a path to a .env-style credentials file the target agents
# read themselves. Full schema: docs/conventions.md, "Orchestrator &
# run-config contract".

target:
  url: https://rakesh-freshsales-ind-sep21.myfreshworks.com/  # replace with your own trial tenant's URL
  # slug: freshsales            # optional — derived from url's hostname if omitted
  product: freshsales           # playwright-tests/freshsales/ — the tenant subdomain is not a product name
  maxPages: 25                  # CRM apps are module-heavy (Leads/Contacts/Accounts/Deals/
                                 # Tasks/Reports); a plain event-site depth is too shallow here
  maxDepth: 3

feature:
  slug: lead-to-deal-pipeline
  description: >
    Create and qualify a lead, convert it into a contact/account, create a
    deal from it, and move that deal across stages on the sales pipeline
    Kanban board — including logging an activity (task/call/note) against
    the deal along the way.
  requirement_docs: []          # optional: paths to requirement docs / mockups, if any exist

# --- Authorization for anything beyond an agent's safe-by-default behavior.
# The orchestrator can only exercise opt-in exceptions the spoke agents
# already define — it can never override a hard rule (see orchestrator-agent.md).
authorizations:
  mode: readonly                 # readonly (default) | full-run
                                  # readonly   = explore-agent stays a non-mutating crawler;
                                  #              api-testing-agent's Playwright specs default to
                                  #              GET-only and it never runs k6 live;
                                  #              playwright-automation-agent generates mutating
                                  #              specs but skips them at run time.
                                  # full-run   = explore-agent performs full UI interaction
                                  #              (creating leads/contacts/deals, moving pipeline
                                  #              stages); api-testing-agent generates+executes
                                  #              full GET/POST/PUT/PATCH/DELETE coverage and may
                                  #              run a live k6 load test; playwright-automation-
                                  #              agent executes mutating specs live.
                                  # ONLY set full-run against your own trial tenant above — never
                                  # against anyone else's Freshsales account. Even in full-run,
                                  # every agent still scopes delete/cancel actions to leads/
                                  # contacts/deals it created itself this run (see each stage's
                                  # created-entities.json contract) — never pre-existing CRM data.
  authenticated_crawl: true      # true = explore-agent performs an authenticated crawl using
                                  #        session_state_file below (never by typing credentials
                                  #        itself — see docs/conventions.md's session_state_file entry)
  credentials_file: playwright-tests/freshsales/.env.freshsales   # a FILE PATH, never inline values.
                                  # Used by playwright-automation-agent / api-testing-agent's own
                                  # scripted logins, NOT read by explore-agent.
  session_state_file: playwright-tests/freshsales/.auth/freshsales-handoff.json  # e.g. playwright-tests/freshsales/.auth/freshsales-handoff.json — a
                                  # pre-authenticated storageState (or session-cookie value file) a
                                  # human produces by completing this tenant's login + reCAPTCHA
                                  # once, interactively, out-of-band. Leave null to let explore-agent
                                  # stop at the login wall, or to let playwright-automation-agent /
                                  # api-testing-agent report the CAPTCHA-gated auth wall as a hard
                                  # blocker per their own auth-fallback rule (see feedback/
                                  # playwright-automation-agent/2026-09-21-freshsales-recaptcha-
                                  # blocks-scripted-login.md and feedback/api-testing-agent/2026-09-
                                  # 21-freshsales-recaptcha-blocks-api-level-auth-too.md for exactly
                                  # what happened on this tenant without one).

testcases:
  output_format: csv # markdown-table | gherkin | csv | testrail

# --- Applied only to [Nice-to-have]-tagged clarification questions that
# `answers` below doesn't already cover. Never applied to [Blocking]
# questions — those always halt the run if unanswered, by design.
defaults:
  unconfirmed_behavior_policy: assume-standard-and-flag   # assume-standard-and-flag | skip-coverage
  unconfirmed_edge_case_policy: flag-as-unconfirmed-case  # flag-as-unconfirmed-case | omit

# --- Free-form pre-answers for specific questions you already anticipate.
# The orchestrator matches a Pass-1 question to an entry here by a
# case-insensitive substring match against `match`; first match wins.
# Add as many as you like — this is the main lever for avoiding a halt.
answers:
  - match: "create and qualify a lead"
    answer: >
      Use the Contact-status substitution: create a Contact with default
      Status=New/Lifecycle=Lead, then advance Contact Status to "Qualified"
      (which auto-promotes Lifecycle stage to "Sales Qualified Lead"). This
      is the lead-equivalent mechanism for this tenant, since the Leads
      module returns 403 for this role.
  - match: "no separate \"Leads\" module"
    answer: >
      Target the newer layout where a lead is a Contact with a lifecycle
      stage. Use the Contact-status substitution described above.
  - match: "qualify a lead\" mean concretely"
    answer: >
      Advance Contact Status to "Qualified" (auto-promotes Lifecycle stage to
      "Sales Qualified Lead").
  - match: "What are the conversion rules"
    answer: >
      Use standard defaults: convert the qualified contact, link or create an
      Account, and create a Deal from it. Flag any unconfirmed rules in the
      test cases as unconfirmed.
  - match: "which pipeline and stages"
    answer: >
      Use the default pipeline and move one deal through all of its stages in
      order, first to last, without closing it as Won or Lost.
  - match: "How should the deal be moved"
    answer: "Drag and drop the deal card between columns on the Kanban board."
  - match: "Which activity types must be logged"
    answer: "Use standard/default coverage for Task/Call/Note activity types."
  - match: "confirm the authorization mode"
    answer: "Confirmed: full-run, against this trial tenant only."
  - match: "What format should the test cases"
    answer: "CSV."
  # Short topic keywords: Pass-1 question wording varies between runs.
  - match: "no Leads module"
    answer: >
      Lead = a Contact in an early lifecycle stage (Status=New/Lifecycle=Lead).
      Use the Contact-status substitution described above. Same tenant and role.
  - match: "does \"qualify\" mean"
    answer: >
      Advance Contact Status to "Qualified" (auto-promotes Lifecycle stage to
      "Sales Qualified Lead"). Use these exact values.
  - match: "convert into contact/account"
    answer: >
      Standard defaults: a Contact linked to a new Account (or an existing one
      if the UI offers it). Derive mandatory fields from the live UI form
      validation; flag anything unconfirmed.
  - match: "created \"from\" the lead"
    answer: >
      Standard defaults: use the Deals "+ New Deal" form with the contact and
      account linked. Derive required deal fields from the live UI form
      validation; flag anything unconfirmed.
  - match: "How should stage moves"
    answer: >
      Kanban drag-and-drop across all stages of the default pipeline, in order,
      without closing the deal as Won or Lost. Do not cover Won/Lost behavior.
  - match: "activity types are in scope"
    answer: >
      Task, Call and Note with standard/default coverage, logged from the deal
      detail/summary panel. Derive required fields from the live UI.
  - match: "authorizations.mode"
    answer: >
      full-run, confirmed, against this trial tenant only. Deliberately invalid
      submissions blocked by validation may run live.
  - match: "What output format"
    answer: "CSV."
  # Shortest distinctive keywords, since Pass-1 wording drifts between runs.
  - match: "convert into a contact"
    answer: >
      Standard defaults: a Contact linked to a new Account (or an existing one
      if the UI offers it). Record the observed links/ownership/stage values;
      flag anything unconfirmed.
  - match: "pipeline(s)"
    answer: >
      Use the default pipeline and move one deal through all of its stages in
      order, first to last (forward one stage at a time). Do not cover
      skipping, backward moves, Won or Lost behavior.
  - match: "stage move"
    answer: >
      Kanban drag-and-drop. Assert the card appears in the target column and
      persists after reload.
  - match: "activity types must be covered"
    answer: >
      Task, Call and Note with standard/default coverage, attached via the deal
      detail/summary panel. Derive required fields from the live UI; verify in
      the deal timeline.
  - match: "Validation-only negative"
    answer: >
      Yes, include them (missing required field, invalid email/phone, empty
      deal name or non-numeric amount, task with no title). Record the observed
      error messages.
  - match: "output format"
    answer: "CSV."
  - match: "Leads module returns 403"
    answer: >
      Skip Leads-module coverage entirely; rely solely on the
      Contact-substitution flow above. Do not add a dedicated negative/403
      test case for the Leads module access restriction.
  - match: "should the generated positive/mutating test cases"
    answer: >
      Yes, execute live against this tenant, scoped to entities the test
      run itself creates (tracked via created-entities.json), consistent
      with authorizations.mode: full-run.
  - match: "activity type coverage"
    answer: "Use standard/default coverage for Task/Call/Note activity types."
  - match: "Account-creation path coverage"
    answer: "Use standard/default coverage for the Account-creation path."

feedback_loop:
  auto_invoke_implementor: false  # false = orchestrator only reports filed feedback file paths

git:
  auto_commit: false             # orchestrator never runs `git commit` unless this is explicitly true
