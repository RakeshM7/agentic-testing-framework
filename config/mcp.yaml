# MCP servers, defined once. `node scripts/build-agents.mjs` renders them into every platform's MCP config file (the
# `mcp_config` of each platform in config/platforms.yaml: .mcp.json for Claude Code, .vscode/mcp.json for VS Code).
# Never edit those files by hand; `npm run check` fails on drift.
#
# `browser_server` is the server whose browser_* tools an agent gets when config/permissions.yaml grants it
# `live_target.browser`. It is product-neutral (D-076): `--init-page scripts/browser/init-page.cjs` loads the active
# run's saved session (authorizations.session_state_file, when authenticated_crawl is true) into every new browser
# context, and aborts every write to the product's hosts in a readonly run. No --storage-state: switching products needs
# no rebuild. The guard lets readonly agents type and select only while this init page is configured.
#
# `--browser chromium` runs Playwright's own Chromium, so no system Chrome is needed; the doctor checks that the build
# this @playwright/mcp version needs is downloaded (`make doctor` installs it).

browser_server: playwright

servers:
  playwright:
    command: npx
    args:
      - "-y"
      - "@playwright/mcp@0.0.83"
      - "--browser"
      - "chromium"
      - "--isolated"
      - "--init-page"
      - "scripts/browser/init-page.cjs"
